<title>¿Dónde se te va el dinero?</title>
<style>
:root {
  --fondo: #0e1014;
  --tarjeta: #171a21;
  --tarjeta-2: #1e222b;
  --borde: #2a2f3a;
  --texto: #eceef3;
  --suave: #a3abba;
  --acento: #f5b942;
  --rojo: #ff7a6b;
  --verde: #45d39a;
  --azul: #7fb3ff;
  --papel: #f6f1e4;
  --tinta: #22201b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: anywhere;
}
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
h1 { font-size: 1.7rem; line-height: 1.15; margin: 8px 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; margin: 0 0 10px; color: var(--acento); }
h3 { font-size: 1rem; margin: 22px 0 10px; }
.subtitulo { margin: 0 0 10px; color: var(--suave); }
.privacidad { margin: 0; font-size: 0.88rem; color: var(--verde); }
.nota { color: var(--suave); font-size: 0.88rem; margin: 6px 0 12px; }
.bloque { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 16px; margin-top: 16px; }
.visualmente-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* Selector de sector */
.sectores { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sectores label {
  display: flex; align-items: center; min-height: 52px; padding: 10px 12px;
  background: var(--tarjeta-2); border: 1px solid var(--borde); border-radius: 10px;
  cursor: pointer; font-size: 0.92rem; line-height: 1.2;
}
.sectores input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sectores input:checked + label { border-color: var(--acento); background: #2a2516; color: #fff; box-shadow: inset 0 0 0 1px var(--acento); }
.sectores input:focus-visible + label { outline: 3px solid var(--azul); outline-offset: 2px; }
.idioma { margin-bottom: 10px; }

/* Botones */
.botones { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.boton {
  font: inherit; font-weight: 600; border-radius: 10px; padding: 11px 16px; min-height: 44px;
  border: 1px solid var(--borde); background: var(--tarjeta-2); color: var(--texto); cursor: pointer;
}
.boton.primario { background: var(--acento); color: #1a1406; border-color: var(--acento); }
.boton.secundario { border-color: var(--acento); color: var(--acento); }
.boton.fantasma { background: transparent; color: var(--suave); }
.boton:disabled { opacity: 0.55; cursor: not-allowed; }
.boton:focus-visible, input:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
.aviso-ejemplo {
  background: #3a2c08; color: #ffd98a; border: 1px dashed var(--acento); border-radius: 8px;
  padding: 8px 10px; font-size: 0.85rem; font-weight: 600; margin: 0 0 12px;
}

/* Entradas */
.entradas { display: grid; gap: 14px; }
.campo label { display: block; font-weight: 600; }
.campo .ayuda { display: block; font-size: 0.82rem; color: var(--suave); margin: 2px 0 6px; }
.caja { display: flex; align-items: stretch; }
.caja input {
  flex: 1; min-width: 0; font: inherit; font-size: 1.1rem; padding: 10px 12px; min-height: 46px;
  background: #0b0d11; color: var(--texto); border: 1px solid var(--borde); border-right: 0;
  border-radius: 10px 0 0 10px; font-variant-numeric: tabular-nums;
}
.caja .unidad { display: flex; align-items: center; padding: 0 12px; border: 1px solid var(--borde); border-radius: 0 10px 10px 0; color: var(--suave); background: var(--tarjeta-2); }
.campo.ingreso .caja input { border-color: #3c4a3f; }
.campo .vivo { font-size: 0.82rem; color: var(--suave); margin-top: 4px; min-height: 1.2em; }
.campo .vivo.alerta { color: #ffb3a8; }
.campo .error { color: var(--rojo); font-size: 0.85rem; margin-top: 4px; }
.campo input[aria-invalid="true"] { border-color: var(--rojo); }

/* Cifras grandes */
.cifras { display: grid; gap: 10px; }
.cifra { background: var(--tarjeta-2); border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; }
.cifra .etiqueta { font-size: 0.82rem; color: var(--suave); text-transform: uppercase; letter-spacing: 0.04em; }
.cifra .valor { font-size: 2rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cifra .extra { font-size: 0.88rem; color: var(--suave); }
.cifra.negativo .valor { color: var(--rojo); }
.cifra.fuga .valor { color: var(--acento); }
.fuga-nota { margin-top: 10px; }

/* Ticket */
.ticket {
  background: var(--papel); color: var(--tinta); margin: 16px 0 0; padding: 18px 16px 22px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.9rem;
  position: relative;
  -webkit-mask: radial-gradient(circle 6px at 50% 0, transparent 98%, #000) top/14px 51% repeat-x,
                radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) bottom/14px 51% repeat-x;
          mask: radial-gradient(circle 6px at 50% 0, transparent 98%, #000) top/14px 51% repeat-x,
                radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) bottom/14px 51% repeat-x;
}
.ticket h3 { margin: 0 0 8px; text-align: center; font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; }
.ticket .fila { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.ticket .fila span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
.ticket .sep { border-top: 1px dashed #8a8475; margin: 6px 0; }
.ticket .total { font-weight: 800; font-size: 1rem; }
.ticket .pc { color: #6b6658; font-size: 0.8rem; }

/* Semáforo */
.semaforo { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.semaforo li { background: var(--tarjeta-2); border: 1px solid var(--borde); border-left-width: 6px; border-radius: 10px; padding: 10px 12px; }
.semaforo .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.semaforo .nombre { font-weight: 700; }
.semaforo .estado { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.semaforo .datos { font-size: 0.88rem; color: var(--suave); margin-top: 4px; }
.semaforo .detalle { font-size: 0.9rem; margin-top: 2px; }
.semaforo .calidad { display: inline-block; font-size: 0.75rem; margin-top: 6px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--borde); color: var(--suave); }
.semaforo .calidad.sin_fuente { border-color: #6b5320; color: #f0c86a; }
.semaforo .calidad.verificado { border-color: #24543f; color: var(--verde); }
.semaforo .fuente { font-size: 0.75rem; color: var(--suave); margin-top: 4px; word-break: break-all; }
.e-vigilar { border-left-color: var(--rojo) !important; }
.e-vigilar .estado { background: #4a1f1a; color: #ffb3a8; }
.e-en_rango { border-left-color: var(--verde) !important; }
.e-en_rango .estado { background: #143a2a; color: #9ff0c9; }
.e-por_debajo { border-left-color: var(--azul) !important; }
.e-por_debajo .estado { background: #172a47; color: #bcd6ff; }
.e-sin_dato .estado, .e-sin_ventas .estado, .e-sin_rango .estado { background: #2a2f3a; color: var(--suave); }

/* Compartir */
.compartir-opciones { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; margin: 4px 0 12px; }
.compartir-opciones input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; }
.texto-compartir { width: 100%; min-height: 150px; font: 0.9rem/1.4 ui-monospace, Menlo, Consolas, monospace; background: #0b0d11; color: var(--texto); border: 1px solid var(--borde); border-radius: 10px; padding: 10px; margin-top: 10px; }
.estado-copia { font-size: 0.88rem; color: var(--verde); min-height: 1.2em; margin: 6px 0 0; }
.imagen-compartir { display: block; width: 100%; height: auto; border-radius: 10px; margin-top: 12px; border: 1px solid var(--borde); }
a.boton { display: inline-flex; align-items: center; text-decoration: none; }

/* Captación */
.captacion input[type="email"] { width: 100%; font: inherit; padding: 10px 12px; min-height: 46px; background: #0b0d11; color: var(--texto); border: 1px solid var(--borde); border-radius: 10px; margin: 6px 0 10px; }
.captacion .consentimiento { display: flex; gap: 8px; align-items: flex-start; font-size: 0.88rem; margin-bottom: 12px; }
.captacion .consentimiento input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; }
.captacion .mensaje { font-size: 0.9rem; min-height: 1.2em; }

.pie { color: var(--suave); font-size: 0.8rem; margin-top: 22px; }
.pie p { margin: 0 0 8px; }

@media (min-width: 520px) {
  .sectores { grid-template-columns: 1fr 1fr 1fr; }
  .cifras { grid-template-columns: 1fr 1fr; }
  .cifras .cifra.fuga { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .cifra .valor { transition: color 0.2s; }
}
.bloque:empty { display: none; }

/* Barra fija con el resumen mientras se rellenan los datos */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: rgba(14, 16, 20, 0.96); border-top: 1px solid var(--borde);
  font-size: 0.9rem; font-variant-numeric: tabular-nums;
}
.barra-texto { min-width: 0; }
.barra-texto b { color: var(--acento); }
.barra-boton { padding: 8px 12px; min-height: 40px; flex: none; }
main { padding-bottom: 96px; }
.sin-js { max-width: 560px; margin: 16px auto; padding: 16px; background: #3a2c08; color: #ffd98a; border-radius: 10px; }

</style>
</head>

  </footer>
</main>

<script>
/* ==== config.js ==== */
/* Configuración. Cambia estos valores y vuelve a generar con `make build`.
   Todo vacío por defecto: sin marca, sin enlace y sin captación (cero red). */
var CONFIG = {
  // Nombre o marca que aparece en la imagen para compartir. Vacío = sin marca.
  MARCA: '',
  // Enlace público donde vas a alojar la calculadora (se añade al texto copiado).
  ENLACE_PUBLICO: '',
  // URL https que recibirá { correo, sector } por POST JSON. Vacío = captación
  // desactivada: el bloque muestra «Próximamente» y el HTML no lleva código de red.
  ENDPOINT_AVISO: '',
  // Texto de la oferta en el bloque final. Vacío = texto por defecto.
  TEXTO_OFERTA: ''
};
if (typeof module === 'object' && module.exports) module.exports = CONFIG;

/* ==== formato.js ==== */
/* Formato de números en español (es-ES). Puro: lo usan la página y los tests. */
(function (raiz, fabrica) {
  if (typeof module === 'object' && module.exports) module.exports = fabrica();
  else raiz.Formato = fabrica();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var NBSP = ' ';

  function crear(opciones) {
    // useGrouping 'always' para que 2500 salga como 2.500 (es-ES por defecto no
    // agrupa números de cuatro cifras). Si el navegador no lo admite, true.
    try {
      opciones.useGrouping = 'always';
      var f = new Intl.NumberFormat('es-ES', opciones);
      if (f.format(2500) === '2.500') return f;
    } catch (e) { /* navegador antiguo */ }
    opciones.useGrouping = true;
    try { return new Intl.NumberFormat('es-ES', opciones); } catch (e2) { return null; }
  }

  var fEntero = crear({ maximumFractionDigits: 0 });
  var fUnDecimal = crear({ minimumFractionDigits: 0, maximumFractionDigits: 1 });

  function respaldo(v, decimales) {
    var s = Math.abs(v).toFixed(decimales).split('.');
    var ent = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (v < 0 ? '-' : '') + ent + (s[1] && Number(s[1]) !== 0 ? ',' + s[1] : '');
  }

  function numero(v, decimales) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    var f = decimales ? fUnDecimal : fEntero;
    var redondeado = decimales ? Math.round(v * 10) / 10 : Math.round(v);
    if (redondeado === 0) redondeado = 0; // evita «-0»
    var txt = f ? f.format(redondeado) : respaldo(redondeado, decimales ? 1 : 0);
    return txt.replace(/−/g, '-');
  }

  function euros(v) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    return numero(v, 0) + NBSP + '€';
  }

  // proporcion en tanto por uno (0.315 → «31,5 %»)
  function porcentaje(p) {
    if (p === null || p === undefined || !isFinite(p)) return '—';
    if (p > 0 && p * 100 < 0.05) return '<' + numero(0.1, 1) + NBSP + '%'; // no mostrar «0 %» si hay importe
    return numero(p * 100, 1) + NBSP + '%';
  }

  // rango en % ({min: 28, max: 35} → «28–35 %»)
  function rango(r) {
    if (!r) return '—';
    return numero(r.min, 1) + '–' + numero(r.max, 1) + NBSP + '%';
  }

  // Para devolver al campo lo escrito con formato español, hasta 2 decimales
  // (24000 → «24.000», 1234.5 → «1.234,5»). Sin símbolo para poder seguir editando.
  function entrada(v) {
    if (v === null || v === undefined || !isFinite(v)) return '';
    var r = Math.round(v * 100) / 100;
    var ent = Math.trunc(r);
    var dec = Math.round(Math.abs(r - ent) * 100);
    var txt = numero(ent, 0);
    if (dec) txt += ',' + String(dec).padStart(2, '0').replace(/0$/, '');

      if (k === 'texto') n.textContent = v;
      else if (k === 'clase') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (hijos || []).forEach(function (h) { if (h) n.appendChild(typeof h === 'string' ? document.createTextNode(h) : h); });
    return n;
  }

  function sectorActual() {
    for (var i = 0; i < DATOS.sectores.length; i++) if (DATOS.sectores[i].id === estado.sectorId) return DATOS.sectores[i];
    return null;
  }

  function aplicarTextosFijos() {
    document.documentElement.lang = estado.idioma;
    var nodos = document.querySelectorAll('[data-t]');
    for (var i = 0; i < nodos.length; i++) nodos[i].textContent = t(nodos[i].getAttribute('data-t'));
    var cfg = window.CONFIG || {};
    document.getElementById('texto-privacidad').textContent = t(cfg.ENDPOINT_AVISO ? 'app.privacidad_captacion' : 'app.privacidad');
    document.title = t('app.titulo');
  }

  /* ---------- Selector de sector ---------- */
  function pintarSectores() {
    var caja = document.getElementById('sectores');
    DATOS.sectores.forEach(function (s) {
      var id = 'sector-' + s.id;
      var radio = el('input', { type: 'radio', name: 'sector', id: id, value: s.id });
      radio.addEventListener('change', function () { elegirSector(s.id); });
      caja.appendChild(radio);
      caja.appendChild(el('label', { 'for': id, texto: s.nombre }));
    });
  }

  function elegirSector(id) {
    estado.sectorId = id;
    if (!estado.valores[id]) estado.valores[id] = {};
    var radio = document.getElementById('sector-' + id);
    if (radio && !radio.checked) radio.checked = true;
    document.getElementById('zona-calculo').hidden = false;
    document.getElementById('bloque-captacion').hidden = false;
    pintarEntradas();
    recalcular();
  }

  /* ---------- Entradas ---------- */
  function pintarEntradas() {
    var s = sectorActual();
    var form = document.getElementById('entradas');
    form.textContent = '';
    var vals = estado.valores[s.id];
    s.partidas.forEach(function (p) {
      var idInput = 'in-' + p.id;
      var input = el('input', {
        id: idInput, name: p.id, type: 'text', inputmode: 'decimal', enterkeyhint: 'next',
        autocomplete: 'off', spellcheck: 'false', placeholder: '0',
        'aria-describedby': 'ay-' + p.id + ' vivo-' + p.id + ' err-' + p.id
      });
      input.value = vals[p.id] || '';
      input.addEventListener('input', function () {
        vals[p.id] = input.value;
        estado.ejemplo[s.id] = false;
        recalcular();
      });
      input.addEventListener('keydown', function (ev) {
        // Intro pasa al siguiente campo, como la tecla «siguiente» del móvil.
        if (ev.key !== 'Enter') return;
        ev.preventDefault();
        var campos = form.querySelectorAll('input');
        for (var i = 0; i < campos.length - 1; i++) if (campos[i] === input) { campos[i + 1].focus(); return; }
        input.blur();
        document.getElementById('resultados').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      input.addEventListener('blur', function () {
        // Al salir del campo se muestra el número con formato español (24000 → 24.000).
        var r = C.parsearNumero(input.value);
        if (!r.vacio && !r.error && r.valor >= 0) {
          var txt = F.entrada(r.valor);
          if (txt !== input.value) { input.value = txt; vals[p.id] = txt; }
        }
      });
      form.appendChild(el('div', { clase: 'campo ' + (p.tipo === 'ingreso' ? 'ingreso' : 'coste'), 'data-partida': p.id }, [
        el('label', { 'for': idInput, texto: p.nombre }),
        el('span', { clase: 'ayuda', id: 'ay-' + p.id, texto: p.ayuda }),
        el('div', { clase: 'caja' }, [input, el('span', { clase: 'unidad', 'aria-hidden': 'true', texto: '€' })]),
        el('div', { clase: 'vivo', id: 'vivo-' + p.id }),
        el('div', { clase: 'error', id: 'err-' + p.id, role: 'alert' })
      ]));
    });
  }

  function cargarEjemplo() {
    var s = sectorActual();
    if (!s) return;
    var copia = {};
    Object.keys(s.ejemplo || {}).forEach(function (k) { copia[k] = s.ejemplo[k]; });
    estado.valores[s.id] = copia;
    estado.ejemplo[s.id] = true;
    pintarEntradas();
    recalcular();
  }

  function borrar() {
    var s = sectorActual();
    if (!s) return;
    estado.valores[s.id] = {};
    estado.ejemplo[s.id] = false;
    pintarEntradas();
    recalcular();
  }

  /* ---------- Resultados ---------- */
  function partidaPorId(s, id) {
    for (var i = 0; i < s.partidas.length; i++) if (s.partidas[i].id === id) return s.partidas[i];
    return null;
  }

  function recalcular() {
    var s = sectorActual();
    if (!s) return;
    var r = C.calcular(s, estado.valores[s.id]);
    estado.ultimo = { sector: s, resultado: r, ejemplo: !!estado.ejemplo[s.id] };
    document.getElementById('aviso-ejemplo').hidden = !estado.ejemplo[s.id];
    pintarVivos(s, r);
    pintarCifras(s, r);
    pintarTicket(s, r);
    pintarSemaforo(s, r);
    document.getElementById('sin-ventas').hidden = r.ventas > 0;
    pintarBarra(s, r);
    anunciar(s, r);
    if (window.Compartir) window.Compartir.actualizar();
  }

  function pintarVivos(s, r) {
    var errores = {};
    r.avisos.forEach(function (a) { errores[a.id] = a.clave; });
    s.partidas.forEach(function (p) {
      var vivo = document.getElementById('vivo-' + p.id);
      var err = document.getElementById('err-' + p.id);
      var input = document.getElementById('in-' + p.id);
      if (!vivo) return;
      err.textContent = errores[p.id] ? t(errores[p.id]) : '';
      input.setAttribute('aria-invalid', errores[p.id] ? 'true' : 'false');
      if (p.tipo === 'ingreso') {
        var varios = s.partidas.filter(function (x) { return x.tipo === 'ingreso'; }).length > 1;
        vivo.textContent = varios && r.importes[p.id] > 0 && r.ventas > 0 ? F.porcentaje(r.importes[p.id] / r.ventas) + ' ' + t('entradas.de_ventas') : '';
        return;
      }
      var linea = null;
      r.lineas.forEach(function (l) { if (l.id === p.id) linea = l; });
      var partes = [];
      if (linea.proporcion !== null && linea.importe > 0) {
        partes.push(F.porcentaje(linea.proporcion) + ' ' + t(p.base ? 'entradas.de_base' : 'entradas.de_ventas'));
      }
      if (p.rango) partes.push(t('entradas.habitual') + ' ' + F.rango(p.rango));
      if (linea.estado === 'vigilar') partes.push(ICONOS.vigilar + ' ' + t('estado.vigilar'));
      vivo.textContent = partes.join(' · ');
      vivo.className = 'vivo' + (linea.estado === 'vigilar' ? ' alerta' : '');
    });
  }

  function cifra(clase, etiqueta, valor, extra) {
    return el('div', { clase: 'cifra ' + clase }, [
      el('div', { clase: 'etiqueta', texto: etiqueta }),
      el('div', { clase: 'valor', texto: valor }),
      extra ? el('div', { clase: 'extra', texto: extra }) : null
    ]);
  }

  function pintarCifras(s, r) {
    var caja = document.getElementById('cifras');
    caja.textContent = '';
    var hayVentas = r.ventas > 0;
    caja.appendChild(cifra(r.resultado < 0 ? 'resultado negativo' : 'resultado',
      s.etiquetaResultado || t('cifra.resultado'),
      F.euros(r.resultado),
      hayVentas ? F.porcentaje(r.margen) + ' ' + t('cifra.margen') : null));
    if (r.costePrincipal) {
      var cp = r.costePrincipal;
      var extra = s.costePrincipal.explicacion || '';
      if (cp.rango) extra += (extra ? ' · ' : '') + t('entradas.habitual') + ' ' + F.rango(cp.rango) + ' (' + t('calidad.' + cp.rango.calidad) + ')';
      if (cp.estado === 'vigilar' || cp.estado === 'en_rango' || cp.estado === 'por_debajo') extra += ' · ' + t('estado.' + cp.estado);
      caja.appendChild(cifra('principal e-' + cp.estado, s.costePrincipal.nombre + ' ' + t('cifra.sobre_ventas'), F.porcentaje(cp.proporcion), extra));
    }
    caja.appendChild(cifra('fuga', t('cifra.fuga'),
      F.euros(r.fugaMes) + ' ' + t('cifra.fuga_mes'),
      F.euros(r.fugaAnio) + ' ' + t('cifra.fuga_anio')));
  }

  function filaTicket(nombre, valor, clase, extra) {
    return el('div', { clase: 'fila ' + (clase || '') }, [
      el('span', {}, [nombre, extra ? el('span', { clase: 'pc', texto: ' ' + extra }) : null]),
      el('span', { texto: valor })
    ]);
  }

  function pintarTicket(s, r) {
    var tk = document.getElementById('ticket');
    tk.textContent = '';
    tk.appendChild(el('h3', { id: 't-ticket', texto: t('ticket.titulo') }));
    s.partidas.forEach(function (p) {
      if (p.tipo === 'ingreso') tk.appendChild(filaTicket(p.nombre, F.euros(r.importes[p.id])));
    });
    tk.appendChild(filaTicket(t('ticket.ventas'), F.euros(r.ventas), 'total'));
    tk.appendChild(el('div', { clase: 'sep' }));
    r.lineas.forEach(function (l) {
      var p = partidaPorId(s, l.id);
      tk.appendChild(filaTicket(p.nombre, (l.importe > 0 ? '-' : '') + F.euros(l.importe), '', l.proporcionVentas !== null ? F.porcentaje(l.proporcionVentas) : ''));
    });
    tk.appendChild(filaTicket(t('ticket.costes'), (r.totalCostes > 0 ? '-' : '') + F.euros(r.totalCostes), '', r.ventas > 0 ? F.porcentaje(r.totalCostes / r.ventas) : ''));
    tk.appendChild(el('div', { clase: 'sep' }));
    tk.appendChild(filaTicket(s.etiquetaResultado || t('cifra.resultado'), F.euros(r.resultado), 'total', r.margen !== null ? F.porcentaje(r.margen) : ''));
  }

  var ICONOS = { vigilar: '▲', en_rango: '✓', por_debajo: '▼', sin_dato: '·', sin_ventas: '·', sin_rango: '·' };

  function textoFuente(rango) {
    if (!rango) return null;
    if (rango.calidad === 'sin_fuente' || !rango.fuente || !rango.fuente.url) {
      return t('fuente.ninguna') + (rango.fuente && rango.fuente.nota ? ' ' + rango.fuente.nota : '');
    }
    // Texto plano, sin enlace: la página no hace ninguna petición ni navega fuera.
    return t('fuente.consultada') + ': ' + rango.fuente.url + ' (' + t('fuente.fecha') + ' ' + rango.fuente.fecha + ')' +
      (rango.fuente.nota ? '. ' + rango.fuente.nota : '');
  }

  function pintarSemaforo(s, r) {
    var ul = document.getElementById('semaforo');
    ul.textContent = '';
    r.lineas.forEach(function (l) {
      var p = partidaPorId(s, l.id);
      var detalle = l.estado === 'vigilar'
        ? t('estado.vigilar_detalle', { euros: F.euros(l.fuga) })
        : t('estado.' + l.estado + '_detalle');
      var datos = [];
      if (l.proporcion !== null && l.importe > 0) datos.push(F.porcentaje(l.proporcion) + ' ' + t(p.base ? 'entradas.de_base' : 'entradas.de_ventas'));
      if (l.rango) datos.push(t('entradas.habitual') + ' ' + F.rango(l.rango));
      var li = el('li', { clase: 'e-' + l.estado }, [
        el('div', { clase: 'cab' }, [
          el('span', { clase: 'nombre', texto: p.nombre }),
          el('span', { clase: 'estado', texto: ICONOS[l.estado] + ' ' + t('estado.' + l.estado) })
        ]),
        datos.length ? el('div', { clase: 'datos', texto: datos.join(' · ') }) : null,
        el('div', { clase: 'detalle', texto: detalle }),
        l.rango ? el('span', { clase: 'calidad ' + l.rango.calidad, texto: t('calidad.' + l.rango.calidad) }) : null,
        l.rango ? el('div', { clase: 'fuente', texto: textoFuente(l.rango) }) : null
      ]);
      ul.appendChild(li);
    });
  }

  /* Resumen para lectores de pantalla: se anuncia cuando la persona deja de
     escribir (1 s), no a cada tecla. */
  var temporizadorAnuncio = null;
  function anunciar(s, r) {
    clearTimeout(temporizadorAnuncio);
    temporizadorAnuncio = setTimeout(function () {
      var nodo = document.getElementById('anuncio');
      if (r.ventas <= 0) { nodo.textContent = t('resultados.sin_ventas'); return; }
      nodo.textContent = t('anuncio.resumen', {
        resultado: F.euros(r.resultado),
        margen: F.porcentaje(r.margen),
        fuga: F.euros(r.fugaMes),
        vigilar: String(r.lineas.filter(function (l) { return l.estado === 'vigilar'; }).length)
      });
    }, 1000);
  }

  /* ---------- Barra de resumen ---------- */
  var resultadosVisibles = false;
  function pintarBarra(s, r) {
    var barra = document.getElementById('barra');
    var txt = document.getElementById('barra-texto');
    txt.textContent = '';
    txt.appendChild(document.createTextNode(t('barra.fuga') + ': '));
    txt.appendChild(el('b', { texto: F.euros(r.fugaMes) + ' ' + t('cifra.fuga_mes') }));
    txt.appendChild(document.createTextNode(' · ' + t('barra.resultado') + ': ' + F.euros(r.resultado)));
    barra.hidden = resultadosVisibles || r.ventas <= 0;
  }

  function vigilarResultados() {
    var zona = document.getElementById('resultados');
    if (!('IntersectionObserver' in window)) return;
    new IntersectionObserver(function (entradas) {
      resultadosVisibles = entradas[0].isIntersecting;
      if (estado.ultimo) pintarBarra(estado.ultimo.sector, estado.ultimo.resultado);
    }).observe(zona);
  }

  /* ---------- Idioma ---------- */
  // El selector solo aparece si en.json está marcado como completo.
  function pintarIdiomas() {
    if (!TEXTOS.en._completo) return;
    var caja = document.getElementById('selector-idioma');
    var sel = el('select', { id: 'idioma', 'aria-label': t('idioma.etiqueta') }, [
      el('option', { value: 'es', texto: 'Español' }), el('option', { value: 'en', texto: 'English' })
    ]);
    sel.addEventListener('change', function () {
      estado.idioma = sel.value;
      aplicarTextosFijos();
      if (estado.sectorId) { pintarEntradas(); recalcular(); }
    });
    caja.appendChild(sel);
    caja.hidden = false;
  }

  /* ---------- Arranque ---------- */
  function iniciar() {
    aplicarTextosFijos();
    pintarSectores();
    pintarIdiomas();
    vigilarResultados();
    document.getElementById('barra-ver').addEventListener('click', function () {
      document.getElementById('resultados').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.getElementById('btn-ejemplo').addEventListener('click', cargarEjemplo);
    document.getElementById('btn-borrar').addEventListener('click', borrar);
    if (window.Compartir) window.Compartir.montar({ t: t, el: el, F: F, estado: estado, config: window.CONFIG || {} });
    if (window.Captacion) window.Captacion.montar({ t: t, el: el, estado: estado, config: window.CONFIG || {} });
  }

  window.App = { t: t, elegirSector: elegirSector, cargarEjemplo: cargarEjemplo, estado: estado };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();

</script>
</body>
